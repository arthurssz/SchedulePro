[project]
name = "schedulepro"
version = "0.2.0"
description = "Aplicativo de gestão de agendamentos para estabelecimentos."
requires-python = ">=3.10"
dependencies = ["flet==1.1.2", "flet-secure-storage==1.1.2"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet]
org = "com.arthurssz"
product = "SchedulePro"
company = "SchedulePro"
copyright = "Copyright (C) 2026 SchedulePro"

[tool.flet.app]
path = "src"

[tool.flet.android.deep_linking]
scheme = "com.arthurssz.schedulepro"
host = "auth"
