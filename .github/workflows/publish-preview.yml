name: Publicar previa web do SchedulePro

on:
  push:
    branches: [main]
    paths:
      - 'src/schedulepro_ui.py'
      - 'preview/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: schedulepro-pages
  cancel-in-progress: true

env:
  UV_PYTHON: '3.12'
  FLET_CLI_NO_RICH_OUTPUT: '1'

jobs:
  publicar:
    name: Compilar e publicar previa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: astral-sh/setup-uv@v6

      - name: Compartilhar as telas do APK com o navegador
        run: cp src/schedulepro_ui.py preview/src/schedulepro_ui.py

      - name: Validar sintaxe Python
        run: python3 -m compileall -q preview/src

      - name: Preparar URL exclusiva por versão
        run: echo "PREVIEW_VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Compilar Flet para web
        working-directory: preview
        run: uv run flet build web --yes --base-url "/SchedulePro/versions/${PREVIEW_VERSION}/" --route-url-strategy hash --python-version 3.12

      - name: Organizar site e redirecionar à versão atual
        run: |
          mkdir -p "preview/site/versions/${PREVIEW_VERSION}"
          cp -a preview/build/web/. "preview/site/versions/${PREVIEW_VERSION}/"
          echo "<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta http-equiv=\"refresh\" content=\"0;url=versions/${PREVIEW_VERSION}/\"><title>SchedulePro - Previa</title></head><body><a href=\"versions/${PREVIEW_VERSION}/\">Abrir a prévia atual</a></body></html>" > preview/site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview/site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
